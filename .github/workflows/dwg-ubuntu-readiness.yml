                      if cleanup:raise cleanup[0] if routine or error is None else error
                      if routine:
                          self.tick();return {'path':path,'status':'HELD_UNREADABLE','ownerIndex':owner_index,'fileErrorIndex':index},None
                      raise error
                  self.tick()
                  try:after=self.metadata(path)
                  except OSError as reason:self.unstable(reason)
                  require(nine(after)==nine(s),InstabilityObserved)
                  pin={'path':path,'bytes':len(body),'sha256':h.hexdigest(),'physicalNine':nine(s)}
