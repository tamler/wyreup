              record={'classification':'OUTPUT_PROJECTION_PREREQUISITE_DATA_HOLD','reason':reason,'fullPremeasuredLength':bounded_integer(length),'lengthStatus':'MEASURED' if bounded_integer(length) is not None else 'UNAVAILABLE',
                  'positiveBytes':bounded_integer(ctx.positive),'metadataCalls':bounded_integer(ctx.metadata_count),'readers':bounded_integer(len(ctx.owners)),'closedReaders':bounded_integer(sum(r['closed'] for r in ctx.owners)),'pendingReaders':bounded_integer(sum(r['pending'] for r in ctx.owners)),
