name: DWG offline readiness prerequisite data
on:
  push:
    branches:
      - verify/dwg-ubuntu-readiness-20261021-0
permissions: {}
jobs:
  prerequisite-data:
    if: >-
      github.repository == 'tamler/wyreup' &&
      github.ref == 'refs/heads/verify/dwg-ubuntu-readiness-20261021-0' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fixed prerequisite metadata only
        shell: /usr/bin/python3 -I -S -B {0}
