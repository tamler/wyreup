                      self.data['incompleteResolution']={'path':original,'links':links,'parentIdentities':dirs,'observedLink':observed_link};raise
                  except FileNotFoundError as error:
                      index=self.file_error(original,error)
                      try:self.tick()
                      except BaseException:
                          self.data['incompleteResolution']={'path':original,'links':links,'parentIdentities':dirs,'observedLink':observed_link};raise
                      return {'path':original,'status':'ABSENT','fileErrorIndex':index,'links':links,'parentIdentities':dirs}
                  except (PathPolicyRefusal,OSError) as error:
                      index=self.file_error(original,error)
                      try:self.tick()
                      except BaseException:
                          self.data['incompleteResolution']={'path':original,'links':links,'parentIdentities':dirs,'observedLink':observed_link};raise
                      return {'path':original,'status':'HELD','reason':type(error).__name__,'fileErrorIndex':index,'links':links,'parentIdentities':dirs}
                  except BaseException:
                      self.data['incompleteResolution']={'path':original,'links':links,'parentIdentities':dirs,'observedLink':observed_link};raise
              def read(self,path,maximum,proc=False,resolved=None):
                  assert type(maximum) is int and 0<maximum<=TOOL_MAX
