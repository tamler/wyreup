          LIST_PATHS=tuple('/var/lib/dpkg/info/'+pkg+arch+'.list' for pkg in PKGS for arch in ('',':amd64'))
          PROC_PATHS=('/proc/sys/kernel/apparmor_restrict_unprivileged_userns','/proc/sys/user/max_user_namespaces','/proc/sys/kernel/unprivileged_userns_clone')
          PROFILE_PATHS=('/etc/apparmor.d/bwrap','/etc/apparmor.d/bwrap-userns-restrict')
          MANUALS=(('autoreconf','/usr/share/man/man1/autoreconf.1',False),('autoreconf','/usr/share/man/man1/autoreconf.1.gz',True),('bwrap','/usr/share/man/man1/bwrap.1',False),('bwrap','/usr/share/man/man1/bwrap.1.gz',True))
          FLAGS={'autoreconf':('--force','--install','--include','-I'),'bwrap':('--unshare-net','--unshare-user','--ro-bind','--bind','--proc','--dev','--die-with-parent','--new-session','--clearenv','--setenv')}
          ROOTS=('/usr','/bin','/sbin','/lib','/lib64','/etc/alternatives','/etc/apparmor.d','/var/lib/dpkg','/proc/sys')
          REF='refs/heads/verify/dwg-ubuntu-readiness-20261021-0'
