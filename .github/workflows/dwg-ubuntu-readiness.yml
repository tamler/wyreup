                  return base,[tables['packages'][index] for index in value]
              if not key.endswith('Ref'):return key,value
              base=key[:-3]
              name='paths' if base in _SHARED_PATH_KEYS else 'digests' if base in _SHARED_DIGEST_KEYS else base
              assert name in ('paths','digests','physicalNine','identityFive','parentIdentities','contexts')
              assert type(value) is int and 0<=value<len(tables[name])
