              assert all(r['status'] in ('UNKNOWN_NOT_COLLECTED','HELD','OBSERVED') for r in record['roles'])
              assert not record['readinessAccepted'] and not record['enforcementObserved'] and not record['nativeConversionAccepted'] and record['completeDetailOmitted'] is True
          
          # BEGIN_DWG_SHARED_CODEC_V1
          SHARED_SCHEMA='dwg-prerequisite-shared-v1'
          SHARED_TABLES=('paths','physicalNine','identityFive','parentIdentities','contexts','packages','digests')
          SHARED_SEMANTIC_MAX=262144
          SHARED_WIRE_MAX=65536
          _SHARED_PATH_KEYS=('path','candidate','canonical','listPath','listed','canonicalUsrMerged','target','pythonExecutable','selectedCandidate')
          _SHARED_DIGEST_KEYS=('sha256','prefixSHA256','decodedSHA256')
