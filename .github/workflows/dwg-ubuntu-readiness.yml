          def nine(s):
              return [str(getattr(s,k)) for k in ('st_dev','st_ino','st_mode','st_uid','st_gid','st_nlink','st_size','st_mtime_ns','st_ctime_ns')]
          
          def encode(v):return (json.dumps(v,ensure_ascii=True,separators=(',',':'),allow_nan=False)+'\n').encode()
          
          def json_length(value):
