              return record
          
          def _shared_validate_tables(tables):
              assert type(tables) is dict and tuple(tables)==SHARED_TABLES
              for name,rows in tables.items():
                  assert type(rows) is list
                  seen=set()
                  for row in rows:
                      encoded=shared_bytes(row);assert encoded not in seen;seen.add(encoded)
                      if name=='paths':
                          assert type(row) is str and row.startswith('/') and '\x00' not in row
                      elif name in ('physicalNine','identityFive'):
                          assert type(row) is list and len(row)==(9 if name=='physicalNine' else 5)
                          assert all(type(x) is str and x and str(int(x))==x for x in row)
                      elif name=='digests':
                          assert type(row) is str and len(row)==64 and all(c in '0123456789abcdef' for c in row)
                      elif name=='parentIdentities':
                          assert type(row) is list
                          for parent in row:
                              assert type(parent) is dict and tuple(parent)==('pathRef','identityFiveRef')
                              for key,index in parent.items():
                                  _shared_reference(key,index,tables)
                      elif name=='contexts':
                          assert type(row) is list
                          for context in row:
                              assert type(context) is dict and tuple(context)==('matchStart','matchEnd','spelling','byteStart','byteEnd','text','truncated')
                              assert all(type(context[k]) is int and context[k]>=0 for k in ('matchStart','matchEnd','byteStart','byteEnd'))
                              assert context['matchStart']<=context['matchEnd'] and context['byteStart']<=context['byteEnd'] and context['byteEnd']-context['byteStart']<=64
                              assert context['spelling'] in ('literal','escaped') and type(context['text']) is str and len(context['text'])<=64 and type(context['truncated']) is bool
