          def shared_bytes(value):
              return json.dumps(value,ensure_ascii=True,separators=(',',':'),allow_nan=False).encode('ascii')
          
          def shared_project(value):
              tables={name:[] for name in SHARED_TABLES};indices={name:{} for name in SHARED_TABLES};active=set()
              def intern(name,original):
                  key=shared_bytes(original)
                  if key in indices[name]:return indices[name][key]
                  index=len(tables[name]);indices[name][key]=index;tables[name].append(None)
                  tables[name][index]=visit(original) if name in ('parentIdentities','contexts') else original
                  return index
              def visit(item):
                  if type(item) in (dict,list):
                      identity=id(item);assert identity not in active;active.add(identity)
                      try:
                          if type(item) is list:return [visit(x) for x in item]
                          out={}
                          for key,child in item.items():
                              assert type(key) is str and not key.endswith(('Ref','Refs'))
                              if key in _SHARED_PATH_KEYS and type(child) is str and child.startswith('/'):
                                  out[key+'Ref']=intern('paths',child)
                              elif key in _SHARED_DIGEST_KEYS and child is not None:
                                  out[key+'Ref']=intern('digests',child)
                              elif key in ('physicalNine','identityFive','parentIdentities','contexts') and type(child) is list:
                                  out[key+'Ref']=intern(key,child)
                              elif key in _SHARED_PACKAGE_KEYS and type(child) is list:
                                  out[key+'Refs']=[intern('packages',row) for row in child]
