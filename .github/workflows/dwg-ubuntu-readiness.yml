              assert type(record['firstType']) is str and len(record['firstType'])<=32 and type(record['firstTypeTruncated']) is bool
              names=record['secondaryTypes'];flags=record['secondaryTypesTruncated']
              assert type(names) is list and len(names)<=8 and all(type(n) is str and len(n)<=32 for n in names)
              assert type(flags) is list and len(flags)==len(names) and all(type(f) is bool for f in flags)
