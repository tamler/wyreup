name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Refuse a stale deployment
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          git fetch origin main
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$TESTED_SHA" != "$CHECKED_OUT_SHA" ] \
            || [ "$TESTED_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Deploy refused: this successful CI run is no longer current main."
            echo "tested=$TESTED_SHA checkout=$CHECKED_OUT_SHA main=$MAIN_SHA"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wyreup/core... build
      - run: pnpm --filter @wyreup/web build
      - name: Recheck current main before production changes
        run: |
          set -e
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Deploy refused: main changed while this tested source was building."
            exit 1
          fi
      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Idempotent: creates the 'wyreup' project on first run. On subsequent
          # runs the API returns "already exists" and we proceed to deploy.
          command: pages project create wyreup --production-branch main
        continue-on-error: true
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Runs before the code deploy so new endpoints never race their
          # schema. Idempotent: already-applied migrations are skipped.
          command: d1 migrations apply wyreup-prod --remote
      - name: Deploy model worker
        run: pnpm --filter @wyreup/worker-models run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify pinned runtime bytes and R2 cache before Pages
        run: node tools/check-runtime-assets.mjs
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/web/dist --project-name=wyreup --branch=main
