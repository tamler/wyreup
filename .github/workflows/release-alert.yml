name: Main delivery alert

on:
  workflow_run:
    workflows: [CI, Deploy to Cloudflare Pages, Release]
    types: [completed]
    branches: [main]

permissions:
  issues: write

concurrency:
  group: delivery-alert-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_run') &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open or update delivery alert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="Main delivery failure: $RUN_NAME"
          body="Run $RUN_ID attempt $RUN_ATTEMPT failed for $RUN_SHA: $RUN_URL"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" |
            jq -sr --arg title "$title" '[.[][] | select(.pull_request == null and .title == $title and .user.login == "github-actions[bot]") | .number] | first // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
