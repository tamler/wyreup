name: Scheduled dependency security

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tools/test/check-dependency-audit.test.mjs
      - name: Audit production dependencies
        if: always()
        run: node tools/check-dependency-audit.mjs --prod --evidence-dir "${{ runner.temp }}/wyreup-dependency-audit"
      - name: Audit complete dependency graph
        if: always()
        run: node tools/check-dependency-audit.mjs --evidence-dir "${{ runner.temp }}/wyreup-dependency-audit"
      - name: Retain raw dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-dependency-audit
          path: ${{ runner.temp }}/wyreup-dependency-audit/
          if-no-files-found: error
      - name: Review upstream runtime and maintained library dependencies
        if: always()
        run: |
          npm view @huggingface/transformers version dependencies --json
          npm view onnxruntime-node version dependencies --json
          npm view exceljs version dependencies --json
          echo 'Review the official Transformers dependency floors and maintained library UPSTREAM.json records before accepting dependency changes.' >> "$GITHUB_STEP_SUMMARY"
