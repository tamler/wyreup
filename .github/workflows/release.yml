name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual recovery runs CI on main first: gh workflow run CI --ref main.

concurrency: release-main

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      # changesets/action resets its release branch to github.context.sha.
      # For workflow_run, that context can point at a newer default-branch
      # commit than the CI run that triggered this job. Refuse to proceed
      # unless every view of main is still the exact tested commit.
      - name: Confirm release commit passed CI
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CONTEXT_SHA: ${{ github.sha }}
        run: |
          set -e
          git fetch origin main
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$TESTED_SHA" != "$CONTEXT_SHA" ] \
            || [ "$TESTED_SHA" != "$CHECKED_OUT_SHA" ] \
            || [ "$TESTED_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release refused: tested CI commit is no longer the exact main commit Changesets would release."
            echo "tested=$TESTED_SHA context=$CONTEXT_SHA checkout=$CHECKED_OUT_SHA main=$MAIN_SHA"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v5
        with:
          name: release-artifacts
          path: artifacts/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm release:verify

      # npm OIDC trusted-publishing requires npm >= 11.5.1. Node 24 already
      # bundles npm 11.x, so this step is belt-and-braces rather than load-
      # bearing — it pins the floor explicitly so a future runner image that
      # ships a different bundled npm can't silently break OIDC publishing.
      # Kept on the 11 line deliberately: npm 12 is what `@latest` resolves
      # to now, and moving the publish path onto an untested npm major is a
      # change worth making on its own, not as a side effect of a Node bump.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release:publish
          version: pnpm changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Auto-merge the changesets release PR as soon as it's mergeable.
      # The PR's diff is purely (1) version bumps + (2) CHANGELOG entries
      # auto-generated from the .changeset/*.md files — the actual code
      # was already reviewed when each source commit landed on main, so
      # there's no second-look value in gating publish behind a manual
      # merge step. Without this, "release notes accumulate for two
      # weeks while npm stays on an old version" is the failure mode
      # (which is exactly how we got here — see CLAUDE.md > Release gate).
      #
      # Try --auto first (queues the merge behind required checks). If the
      # PR is already in CLEAN state (no required checks to wait on),
      # --auto errors with "Pull request is in clean status" — fall back
      # to an immediate squash merge in that case.
      - name: Enable auto-merge on the changesets release PR
        if: steps.changesets.outputs.pullRequestNumber != '' && steps.changesets.outputs.hasChangesets == 'true'
        run: |
          set -e
          PR="${{ steps.changesets.outputs.pullRequestNumber }}"
          gh pr merge --auto --squash "$PR" \
            || gh pr merge --squash "$PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
