name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint + Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first so downstream packages can resolve @wyreup/core types.
      # Without this, TS falls back to `any` for cross-package imports and
      # the strict `no-unsafe-*` rules cascade into false-positive errors.
      - run: pnpm build
      - run: pnpm lint:root
      - run: pnpm typecheck
      - run: pnpm typecheck:functions

  unit-tests:
    # Exercise the published runtime floor as well as the current LTS.
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MCP worker tests fork dist/worker.js — build first so that artifact
      # exists. Without this, `runInWorker` fails to spawn and every worker-
      # dispatched test reports "Tool worker crashed (exit=1, signal=null)".
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter @wyreup/web check:pwa
      - run: pnpm --filter @wyreup/web check:remote-cache
      - run: pnpm --filter @wyreup/web check:pgp

  gdal-node-integration:
    # convert-geo's Node bridge uses a process.chdir() workaround for an
    # upstream gdal3.js bug (see ROADMAP "Tech debt" item 6). chdir is
    # process-global, so vitest's default threaded pool can race with
    # other tests' cwd-relative work. Skipped from `pnpm test`; run it
    # here in a dedicated job where the process is fresh and isolated.
    name: convert-geo Node integration (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wyreup/core... build
      - run: WYREUP_GDAL_NODE=1 pnpm --filter @wyreup/core test convert-geo

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:packages
      - run: node packages/web/scripts/check-seo.mjs
      - run: pnpm exec vitest run tools/test
      - run: pnpm release:pack
      - run: pnpm release:verify
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            !packages/*/dist/**/*.map
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: artifacts/

  functions:
    name: Backend security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: pnpm test:functions

  package-consumers:
    name: Packed consumers (${{ matrix.os }}, Node ${{ matrix.runtime.node }}, npm ${{ matrix.runtime.npm }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime:
          - { node: 22.13.0, npm: 11 }
          - { node: 24.x, npm: 12 }
        include:
          - os: ubuntu-latest
            runtime: { node: 24.x, npm: 11 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.runtime.node }}
          cache: pnpm
      - run: npm install -g npm@${{ matrix.runtime.npm }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: release-artifacts
          path: artifacts/
      - run: pnpm release:verify
      - run: pnpm check:consumers
        env:
          WYREUP_EXPECTED_NPM_MAJOR: ${{ matrix.runtime.npm }}

  isolation-check:
    name: Isolation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/check-isolation.mjs

  runner-coverage:
    name: Runner coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node tools/check-runner-coverage.mjs

  doc-references:
    name: Doc references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node tools/check-doc-references.mjs

  model-allowlist:
    # Verifies every HuggingFace model id referenced by a core tool
    # appears in the wyreup-models Worker's ALLOWED_HF_MODELS set.
    # Without this, a new AI tool would 403 in production after deploy.
    name: Model allowlist sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node tools/check-model-allowlist.mjs

  privacy-scan:
    name: Privacy scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tools/check-privacy.mjs

  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node tools/check-bundle-size.mjs

  web-security-invariants:
    # Defense-in-depth for the static deployment model. The framework is kept
    # patched, and this separately prevents a future change from silently
    # introducing server islands without the required threat-model review.
    name: Web security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Forbid Astro server: directives in web/src'
        run: |
          set -e
          # grep returns exit 1 when there are zero matches — which is what we want.
          # Invert: fail (exit 1 from the job) when ANY match is found.
          if grep -rn 'server:defer\|server-islands\|serverIslands' packages/web/src 2>/dev/null; then
            echo "::error::Astro server: directive found in packages/web/src." \
                 "Server-side rendering needs an explicit security and deployment review."
            exit 1
          fi
          echo "OK — no Astro server-island directives in packages/web/src."
      - name: "Assert astro.config.mjs keeps output: 'static'"
        run: |
          set -e
          # The grep above is defense-in-depth. `output: 'static'` is the
          # deployment contract; changing it requires an SSR adapter and a
          # separate review of request routing, headers, and authentication.
          if ! grep -qE "output:\s*['\"]static['\"]" packages/web/astro.config.mjs; then
            echo "::error::packages/web/astro.config.mjs no longer declares output: 'static'." \
                 "Restore static output or complete an explicit SSR security review."
            exit 1
          fi
          echo "OK — packages/web is output: 'static'."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # All severities and both production and development dependencies block.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm audit
