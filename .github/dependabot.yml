version: 2
updates:
  # npm dependencies — group ecosystem updates by package to reduce PR noise.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    groups:
      # Security/parser libs — these are the highest review priority.
      security-and-parsers:
        patterns:
          - 'dompurify'
          - 'jszip'
          - 'pdfjs-dist'
          - '@anthropic-ai/sdk'
          - '@modelcontextprotocol/sdk'
      # Build/test tooling — bundle to reduce PR churn.
      build-tooling:
        patterns:
          - 'tsup'
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
          - 'eslint*'
          - '@typescript-eslint/*'
    ignore:
      # Framework major upgrades remain deliberate because Astro, Svelte,
      # and the PWA integration have coupled peer ranges. Security patches
      # within the current majors still update normally.
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      # PDF.js majors can raise the public Node runtime floor and change
      # parser lifecycle APIs, so migrate them with consumer verification.
      - dependency-name: 'pdfjs-dist'
        update-types: ['version-update:semver-major']
      # TypeScript majors break tsup's DTS build (TS 6 did on 2026-05-25;
      # TS 7 is the tsgo compiler). Future Vitest majors also need an
      # explicit test-runner migration review.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']

  # GitHub Actions versions — keep workflow actions current.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 3
